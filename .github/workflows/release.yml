# Builds Game Vault for macOS, Windows, and Linux and uploads the installers
# to a GitHub Release.
#
# Trigger: pushing a version tag (e.g. `git push --follow-tags` after
# `npm version minor`). Can also be run by hand from the Actions tab.
#
# Each platform builds on its own runner — electron-builder can't
# cross-compile a real Windows/macOS installer from another OS.
#
# `npm run release` runs electron-builder with `--publish always`, which
# creates a DRAFT GitHub Release for the tag and attaches the installers to
# it. Review the draft, add release notes, and publish it manually.

name: Build & release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

# Let the built-in GITHUB_TOKEN create the release and upload files.
permissions:
  contents: write

# Cache the Electron binary downloads (big, and macOS runner minutes count
# 10x) in one workspace folder so a single actions/cache step covers all OSes.
env:
  ELECTRON_CACHE: ${{ github.workspace }}/.cache/electron
  ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.cache/electron-builder

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Cache Electron binaries
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.cache
          key: ${{ runner.os }}-electron-${{ hashFiles('package-lock.json') }}
          restore-keys: ${{ runner.os }}-electron-

      - name: Install dependencies
        run: npm ci

      - name: Build and publish to the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run release
