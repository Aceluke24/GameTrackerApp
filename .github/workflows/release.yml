# Builds Game Vault for macOS, Windows, and Linux and uploads the installers
# to a single draft GitHub Release.
#
# Trigger: pushing a version tag (e.g. `git push --follow-tags` after
# `npm version minor`). Can also be run by hand from the Actions tab (that
# builds the installers but skips the release step, since there's no tag).
#
# Two stages, on purpose:
#   1. `build` — one job per OS (electron-builder can't cross-compile). Each
#      builds its installers and uploads them as workflow artifacts. No job
#      touches the GitHub Release here.
#   2. `release` — one job, runs after all three. Collects every artifact and
#      creates ONE draft release. Doing this in a single job avoids the race
#      where parallel jobs each create their own duplicate draft.
#
# Review the draft, add release notes, and publish it manually. Publishing is
# also what exposes it to auto-update (electron-updater ignores drafts).

name: Build & release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

env:
  ELECTRON_CACHE: ${{ github.workspace }}/.cache/electron
  ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.cache/electron-builder

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Cache Electron binaries
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.cache
          key: ${{ runner.os }}-electron-${{ hashFiles('package-lock.json') }}
          restore-keys: ${{ runner.os }}-electron-

      - name: Install dependencies
        run: npm ci

      - name: Build installers (no publish)
        run: |
          npm run build
          npx electron-builder --publish never

      - name: Upload installers as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ runner.os }}
          if-no-files-found: error
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.AppImage
            release/latest*.yml
            release/*.blockmap

  release:
    needs: build
    runs-on: ubuntu-latest
    # Only make a release for real tag pushes, not manual/branch runs.
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download all installers
        uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true   # flatten the per-OS folders into one

      - name: Create or update the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" installers/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" installers/* \
              --repo "$GITHUB_REPOSITORY" \
              --draft \
              --title "$TAG" \
              --notes "Draft build — add release notes and publish."
          fi
